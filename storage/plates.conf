# Extra Apache config for the Storage server.
# It is appended to httpd.conf with an "Include" line in the Dockerfile.

ServerName storage
ServerTokens Prod
ServerSignature Off

# The camera photos live here. In docker-compose.yml a named volume is mounted on this folder.
<Directory "/usr/local/apache2/htdocs/plates">
    # Directory listing is how the dashboard discovers which photos exist.
    Options +Indexes
    IndexOptions FancyIndexing HTMLTable NameWidth=* SuppressDescription
    IndexOrderDefault Descending Name
    AllowOverride None
    Require all granted

    # Never let the browser cache the listing, so new cars show up immediately.
    <IfModule mod_headers.c>
        Header set Cache-Control "no-store"
    </IfModule>
</Directory>
