name: CI/CD

# Runs on every push to any branch, on every version tag (v1.0.0 ...), and on pull requests.
on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:

# Least privilege: by default the token can only read the code. The publish job asks for more.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now pointless, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Job 1 (required): is the Docker build healthy?
  # ------------------------------------------------------------------
  build:
    name: Docker build check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Lint the Dockerfiles (hadolint)
        run: |
          docker run --rm -i hadolint/hadolint < web/Dockerfile
          docker run --rm -i hadolint/hadolint < api/Dockerfile

      - name: Build the images (web + api)
        run: docker compose build

      - name: Start the stack and wait until every service is healthy
        run: docker compose up -d --wait --wait-timeout 90

      - name: Smoke test (same script you can run locally)
        run: bash scripts/smoke-test.sh

      - name: Persistence test (down + up, the data must survive in the Volume)
        run: bash scripts/persistence-test.sh

      - name: Show container logs if something failed
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------
  # Job 2 (bonus): publish the images to GitHub Container Registry (ghcr.io)
  # Only after the build job passed, and only for main or version tags.
  # ------------------------------------------------------------------
  publish:
    name: Publish images to GHCR
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write          # lets the built-in GITHUB_TOKEN push to ghcr.io
    strategy:
      matrix:
        service: [web, api]
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      # Lets one build produce an image for both common CPU types (amd64 = most PCs,
      # arm64 = Apple Silicon, Windows on ARM, Raspberry Pi).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 1. Secure login with the automatic GITHUB_TOKEN (no password stored by us)
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names on ghcr.io must be lowercase, repository names may not be
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_ENV"

      # 2. Automatic tagging (version number)
      #    git tag v1.2.3  ->  :1.2.3  and  :1.2
      #    every push      ->  :sha-abc1234 and :build-<run number>
      #    push to main    ->  :latest
      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=build-${{ github.run_number }}
            type=raw,value=latest,enable={{is_default_branch}}

      # 3. Build and push (both CPU types, with a build cache to make the next run faster)
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
