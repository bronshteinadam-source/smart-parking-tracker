name: CI/CD                                                   # שם ה-workflow. מופיע בלשונית Actions ב-GitHub

# רץ בכל push לכל branch, בכל tag של גרסה (v1.0.0 ...), ובכל pull request.
on:                                                           # מתי ה-workflow מתחיל לרוץ
  push:                                                       # כשדוחפים קוד...
    branches: ["**"]                                          # ...לכל branch
    tags: ["v*.*.*"]                                          # ...וגם כשדוחפים tag של גרסה, למשל v2.0.0
  pull_request:                                               # וגם בכל pull request

# הרשאה מינימלית: כברירת מחדל ה-token יכול רק לקרוא את הקוד. job הפרסום מבקש עוד.
permissions:                                                  # ההרשאות של ה-token האוטומטי של GitHub
  contents: read                                              # קריאת הקוד בלבד

# push חדש לאותו branch מבטל ריצה ישנה שכבר לא רלוונטית.
concurrency:                                                  # מניעת ריצות כפולות
  group: ci-${{ github.ref }}                                 # קבוצה אחת לכל branch או tag
  cancel-in-progress: true                                    # ריצה חדשה מבטלת את הישנה באותה קבוצה

jobs:                                                         # רשימת ה-jobs. כל job רץ על מכונה נפרדת
  # ------------------------------------------------------------------
  # Job 1 (חובה): האם בניית ה-Docker תקינה?
  # ------------------------------------------------------------------
  build:                                                      # ה-job הראשון: בדיקה
    name: Docker build check                                  # השם שמוצג ב-GitHub
    runs-on: ubuntu-latest                                    # המכונה: Linux חדשה וריקה, נוצרת לכל ריצה
    timeout-minutes: 10                                       # אם רץ יותר מ-10 דקות, נעצר
    steps:                                                    # הצעדים, לפי הסדר. צעד שנכשל עוצר את ה-job
      - name: Check out the code                              # צעד 1
        uses: actions/checkout@v6                             # מוריד את הקוד של הריפו למכונה

      - name: Validate docker-compose.yml                     # צעד 2
        run: docker compose config --quiet                    # בודק שקובץ ה-Compose תקין (בלי להריץ אותו)

      - name: Lint the Dockerfiles (hadolint)                 # צעד 3
        run: |                                                # בודק את שני ה-Dockerfiles עם hadolint (כלי שמזהה כתיבה לא טובה). שתי הפקודות למטה
          docker run --rm -i hadolint/hadolint < web/Dockerfile
          docker run --rm -i hadolint/hadolint < api/Dockerfile

      - name: Build the images (web + api)                    # צעד 4
        run: docker compose build                             # בונה את התמונות של web ו-api

      - name: Start the stack and wait until every service is healthy  # צעד 5
        run: docker compose up -d --wait --wait-timeout 90    # מרים הכל ברקע (-d). --wait מחכה שכל השירותים יהיו healthy, עד 90 שניות

      - name: Smoke test (same script you can run locally)    # צעד 6
        run: bash scripts/smoke-test.sh                       # מריץ 7 בדיקות על המערכת שרצה

      - name: Persistence test (down + up, the data must survive in the Volume)  # צעד 7
        run: bash scripts/persistence-test.sh                 # מוסיף רכב, עושה down ואז up, ובודק שהרכב נשאר (הוכחה ל-Volume)

      - name: Show container logs if something failed         # צעד 8
        if: failure()                                         # רץ רק אם צעד קודם נכשל
        run: docker compose logs                              # מדפיס את הלוגים של השירותים כדי להבין מה נכשל

      - name: Clean up                                        # צעד 9
        if: always()                                          # רץ תמיד, גם אחרי כישלון
        run: docker compose down -v                           # מוחק הכל כולל ה-Volume. בסדר, כי המכונה הזמנית נזרקת אחר כך

  # ------------------------------------------------------------------
  # Job 2 (בונוס): פרסום התמונות ל-GitHub Container Registry (ghcr.io)
  # רק אחרי ש-build עבר, ורק עבור main או tag של גרסה.
  # ------------------------------------------------------------------
  publish:                                                    # ה-job השני: פרסום התמונות
    name: Publish images to GHCR                              # השם שמוצג ב-GitHub
    needs: build                                              # מחכה ל-build. אם הוא נכשל, publish לא רץ בכלל
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))  # רק על push ל-main או ל-tag שמתחיל ב-v
    runs-on: ubuntu-latest                                    # מכונת Linux חדשה
    timeout-minutes: 20                                       # אם רץ יותר מ-20 דקות, נעצר
    permissions:                                              # הרשאות מיוחדות ל-job הזה
      contents: read                                          # קריאת הקוד
      packages: write                                         # מאפשר ל-GITHUB_TOKEN לדחוף תמונות ל-ghcr.io
    strategy:                                                 # אסטרטגיית הרצה
      matrix:                                                 # מריץ את אותו job כמה פעמים עם ערכים שונים
        service: [web, api]                                   # פעם עבור web ופעם עבור api
    steps:                                                    # הצעדים של publish
      - name: Check out the code                              # מוריד את הקוד...
        uses: actions/checkout@v6                             # ...של הריפו

      # מאפשר לבנות image אחד לשני סוגי מעבדים
      # (amd64 = רוב המחשבים, arm64 = Apple Silicon, Windows ARM, Raspberry Pi).
      - name: Set up QEMU                                     # מכין אמולטור למעבדים אחרים
        uses: docker/setup-qemu-action@v4                     # מאפשר לבנות ל-arm64 על מכונת amd64

      - name: Set up Docker Buildx                            # מכין את כלי הבנייה המתקדם של Docker
        uses: docker/setup-buildx-action@v4                   # Buildx: תומך בבנייה לכמה פלטפורמות

      # 1. התחברות מאובטחת עם GITHUB_TOKEN האוטומטי (אין סיסמה שמורה אצלנו)
      - name: Log in to ghcr.io                               # התחברות ל-GHCR
        uses: docker/login-action@v4                          # פעולה מוכנה שמתחברת ל-registry
        with:                                                 # הפרמטרים של הפעולה
          registry: ghcr.io                                   # הכתובת של GHCR
          username: ${{ github.actor }}                       # שם המשתמש שדחף את הקוד
          password: ${{ secrets.GITHUB_TOKEN }}               # ה-token האוטומטי של GitHub. אין סיסמה אמיתית

      # שמות image ב-ghcr.io חייבים להיות באותיות קטנות, שמות ריפו לא בהכרח
      - name: Compute image name                              # שם התמונה
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_ENV"  # בונה את שם התמונה באותיות קטנות (,,) ושומר אותו במשתנה IMAGE

      # 2. תיוג אוטומטי (מספר גרסה)
      #    git tag v1.2.3  ->  :1.2.3  ו-:1.2
      #    כל push        ->  :sha-abc1234 ו-:build-<מספר ריצה>
      #    push ל-main    ->  :latest
      - name: Generate tags                                   # מחשב את התגיות של התמונה
        id: meta                                              # שם פנימי, כדי להשתמש בתוצאות הצעד הזה בהמשך
        uses: docker/metadata-action@v6                       # פעולה שמחשבת אוטומטית את רשימת התגיות
        with:                                                 # הפרמטרים
          images: ${{ env.IMAGE }}                            # שם התמונה שחושב קודם
          tags: |                                             # כללי התיוג (השורות למטה): גרסה, major.minor, sha, מספר ריצה, ו-latest עבור main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=build-${{ github.run_number }}
            type=raw,value=latest,enable={{is_default_branch}}

      # 3. בנייה ודחיפה (לשני סוגי המעבדים, עם cache כדי שהריצה הבאה תהיה מהירה)
      - name: Build and push ${{ matrix.service }}            # בונה ודוחף את התמונה
        uses: docker/build-push-action@v7                     # בונה את התמונה ודוחף אותה ל-registry
        with:                                                 # הפרמטרים
          context: ./${{ matrix.service }}                    # התיקייה עם ה-Dockerfile: web או api
          platforms: linux/amd64,linux/arm64                  # בונה לשני סוגי מעבדים
          push: true                                          # דוחף ל-registry (ולא רק בונה)
          tags: ${{ steps.meta.outputs.tags }}                # התגיות שחושבו בצעד meta
          labels: ${{ steps.meta.outputs.labels }}            # מידע נוסף על התמונה (מטא-דאטה)
          cache-from: type=gha,scope=${{ matrix.service }}    # משתמש ב-cache של GitHub מריצות קודמות
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}  # שומר cache לריצות הבאות
