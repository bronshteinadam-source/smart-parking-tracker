name: smart-parking

services:
  web:
    build: ./web
    image: smart-parking-web
    container_name: parking-web
    ports:
      - "8080:80"            # the only door to the outside world
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - parking-net
    restart: unless-stopped

  api:
    build: ./api
    image: smart-parking-api
    container_name: parking-api
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - parking-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: parking-redis
    command: ["redis-server", "--appendonly", "yes"]   # write every change to disk
    volumes:
      - redis-data:/data                                # <- the Volume
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - parking-net
    restart: unless-stopped

volumes:
  redis-data:

networks:
  parking-net:
