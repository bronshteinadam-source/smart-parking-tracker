# Web server config (Nginx). Copied to /etc/nginx/conf.d/default.conf by web/Dockerfile.
server {
    listen 80;
    server_name _;
    server_tokens off;                       # do not advertise the Nginx version

    root /usr/share/nginx/html;
    index index.html;

    # ---------- Basic hardening (headers are inherited by every location below) ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # The dashboard only loads its own files and its own photos, so the browser may only do that.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'" always;

    gzip on;
    gzip_types text/css application/javascript;

    # 1. The dashboard itself (index.html, style.css, app.js).
    #    "expires -1" = Cache-Control: no-cache, so edits show up on a normal refresh.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # 2. The camera photos. Nginx does NOT store them: it forwards the request to the
    #    "storage" container (Apache). "storage" is the service name from
    #    docker-compose.yml - Docker's internal DNS turns it into the container's IP.
    #    Because the browser only ever talks to Nginx, there are no CORS problems and the
    #    Apache container does not need to be published to the outside world.
    #
    #    The name is put in a VARIABLE and we use Docker's built-in DNS server (127.0.0.11).
    #    That makes Nginx look the name up again every few seconds. Without this, Nginx
    #    would remember the IP it saw at startup and break (502) if the storage container
    #    is ever recreated with a new IP, e.g. after `docker compose up -d --build storage`.
    location /plates/ {
        # The dashboard only reads photos: refuse anything except GET and HEAD.
        limit_except GET HEAD {
            deny all;
        }

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $storage_upstream http://storage;
        proxy_pass $storage_upstream;        # no URI part: the original /plates/... path is sent as is
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # 3. Tiny health endpoint used by the Docker healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
