# הגדרות שרת Nginx. web/Dockerfile מעתיק אותן ל-/etc/nginx/conf.d/default.conf.
server {                                                      # הגדרת אתר אחד
    listen 80;                                                # מקשיב לפורט 80 בתוך הקונטיינר (Compose מעביר אליו את 8080)
    server_name _;                                            # מקבל בקשות לכל שם
    server_tokens off;                                        # לא מפרסם את גרסת Nginx

    root /usr/share/nginx/html;                               # התיקייה שממנה מוגשים הקבצים
    index index.html;                                         # הדף הראשי

    # ---------- הקשחה בסיסית (הכותרות חלות על כל ה-location מטה) ----------
    add_header X-Content-Type-Options "nosniff" always;       # הדפדפן לא מנחש סוג קובץ
    add_header Referrer-Policy "no-referrer" always;          # לא שולח את הכתובת שממנה הגיע המשתמש
    # האתר טוען רק את הקבצים והתמונות של עצמו, אז זה מה שמותר לדפדפן.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'" always;  # מדיניות: האתר טוען רק קבצים ותמונות משלו

    gzip on;                                                  # דחיסת תשובות
    gzip_types text/css application/javascript;               # דוחס CSS ו-JavaScript

    # 1. האתר עצמו (index.html, style.css, app.js).
    #    expires -1 = no-cache, כדי ששינויים יופיעו ברענון רגיל.
    location / {                                              # כל בקשה רגילה (האתר)
        try_files $uri $uri/ =404;                            # מחפש קובץ בשם הזה, ואם אין מחזיר 404
        expires -1;                                           # בלי cache
    }

    # 2. ה-API. ל-Nginx אין שום לוגיקה: הוא רק מעביר /api/... לקונטיינר "api"
    #    (Flask). "api" הוא שם השירות מ-docker-compose.yml, וה-DNS הפנימי של
    #    Docker מתרגם אותו ל-IP של הקונטיינר. הדפדפן והמצלמה מדברים רק עם Nginx,
    #    לכן אין בעיות CORS, ואין צורך לפתוח את ה-API החוצה.
    #
    #    השם נשמר במשתנה ומשתמשים ב-DNS הפנימי של Docker (127.0.0.11).
    #    ככה Nginx מחפש את השם מחדש כל כמה שניות. בלי זה הוא זוכר את ה-IP
    #    מההתחלה, ואם קונטיינר ה-API נבנה מחדש עם IP אחר מתקבלת שגיאה 502,
    #    למשל אחרי docker compose up -d --build api.
    #    (הערה: הסבר נוסף על ה-resolver בשורות 42-44)
    location /api/ {                                          # כל בקשה שמתחילה ב-/api/
        # POST = המצלמה מדווחת על רכב, GET = הדאשבורד קורא, DELETE = שחרור רכב.
        limit_except GET POST DELETE {                        # רק שלוש הפעולות האלה מותרות...
            deny all;                                         # ...כל השאר (כמו PUT) נחסם עם 403
        }

        resolver 127.0.0.11 valid=10s ipv6=off;               # ה-DNS הפנימי של Docker. בודק את השם מחדש כל 10 שניות
        set $api_upstream http://api:8000;                    # כתובת ה-API (שם השירות ופורט 8000) נשמרת במשתנה
        proxy_pass $api_upstream;                             # מעביר את הבקשה ל-API, עם הנתיב /api/... כמו שהוא
        proxy_http_version 1.1;                               # גרסת HTTP מול ה-API
        proxy_set_header Host $host;                          # מעביר ל-API את שם השרת המקורי
        proxy_set_header X-Real-IP $remote_addr;              # מעביר את כתובת הלקוח האמיתי
        proxy_connect_timeout 3s;                             # אם אי אפשר להתחבר ל-API תוך 3 שניות, נכשל
        proxy_read_timeout 10s;                               # אם ה-API לא עונה תוך 10 שניות, נכשל
        add_header Cache-Control "no-store" always;           # הדפדפן לא שומר תשובות של ה-API
        add_header X-Content-Type-Options "nosniff" always;   # אותן כותרות אבטחה גם לתשובות ה-API
        add_header Referrer-Policy "no-referrer" always;      # כנ"ל
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;  # מדיניות קשוחה: ל-API אסור לטעון כלום
    }

    # 3. נקודת בדיקה קטנה ש-Docker (ה-healthcheck של web) קורא לה.
    location = /healthz {                                     # הנתיב /healthz בדיוק
        access_log off;                                       # לא רושם ב-log (נקרא כל 10 שניות)
        default_type text/plain;                              # סוג התשובה: טקסט
        return 200 "ok\n";                                    # עונה 200 ו-ok. זה אומר ש-Nginx חי
    }
}
