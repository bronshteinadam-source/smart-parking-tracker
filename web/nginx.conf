# Web server config (Nginx). Copied to /etc/nginx/conf.d/default.conf by web/Dockerfile.
server {
    listen 80;
    server_name _;
    server_tokens off;                       # do not advertise the Nginx version

    root /usr/share/nginx/html;
    index index.html;

    # ---------- Basic hardening (headers are inherited by every location below) ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # The dashboard only loads its own files and its own photos, so the browser may only do that.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'" always;

    gzip on;
    gzip_types text/css application/javascript;

    # 1. The dashboard itself (index.html, style.css, app.js).
    #    "expires -1" = Cache-Control: no-cache, so edits show up on a normal refresh.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # 2. The API. Nginx does NOT contain any logic: it forwards /api/... to the "api"
    #    container (Flask). "api" is the service name from docker-compose.yml - Docker's
    #    internal DNS turns it into the container's IP. The browser and the camera script
    #    only ever talk to Nginx, so there are no CORS problems and the API container does
    #    not need to be published to the outside world.
    #
    #    The name is put in a VARIABLE and we use Docker's built-in DNS server (127.0.0.11).
    #    That makes Nginx look the name up again every few seconds. Without this, Nginx
    #    would remember the IP it saw at startup and break (502) if the api container is
    #    ever recreated with a new IP, e.g. after `docker compose up -d --build api`.
    location /api/ {
        # POST = camera reports a car, GET = dashboard reads, DELETE = release a car.
        limit_except GET POST DELETE {
            deny all;
        }

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;            # no URI part: the original /api/... path is sent as is
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # 3. Tiny health endpoint used by the Docker healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
